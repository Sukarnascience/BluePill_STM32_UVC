; ============================================================
;  bluepill-uvc — Raw USB UVC Camera
;  No libopencm3. STM32 HAL for clock/GPIO only.
;  USB peripheral driven by raw registers.
;
;  Flash: pio run --target upload
; ============================================================

[env:bluepill_f103c8]
platform        = ststm32
board           = bluepill_f103c8
framework       = stm32cube
upload_protocol = stlink
debug_tool      = stlink
monitor_speed   = 115200

build_flags =
    -D STM32F1
    -D STM32F103xB
    -O2
    -std=c11
    -Wall