; ============================================================
;  bluepill-uvc — STM32F103C8T6 UVC Camera (Test Pattern)
;  Framework : libopencm3
;  Upload    : ST-Link v2
; ============================================================

[env:bluepill_f103c8]
platform         = ststm32
board            = bluepill_f103c8
framework        = libopencm3

; ST-Link upload + debug
upload_protocol  = stlink
debug_tool       = stlink

; Optional: if PIO can't find ST-Link, uncomment and set port
; upload_port    = /dev/ttyUSB0

build_flags =
    -D STM32F1                  ; libopencm3 target family
    -D SYSCLK_FREQ_72MHz        ; 72 MHz PLL config
    -O2                         ; Optimize for size+speed
    -Wall
    -Wextra
    -std=c11

; Keep binary small — Blue Pill has only 64KB Flash
; libopencm3 + our code should fit in ~30-40KB
build_unflags =
    -Os

; Serial monitor (for debug printf via SWO or UART)
monitor_speed    = 115200